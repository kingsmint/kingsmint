[package]
name = "kingsmint-app"
version = "0.2.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
