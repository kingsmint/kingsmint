name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest -v

  # the app's page: Biome (app/ui/biome.json), svelte-check (app/ui/svelte.config.js) and djLint ([tool.djlint] in
  # pyproject.toml)
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx biome ci . && npx svelte-check --threshold warning --fail-on-warnings
        working-directory: app/ui
      - run: uv run --locked --group dev djlint app/ui/index.html --check
