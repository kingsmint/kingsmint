name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # tests/test_app_versions.py needs jj; the version the app ships (app/scripts/fetch-sidecars.sh)
      - name: Install jj
        shell: bash
        env:
          JJ_VERSION: 0.47.1
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-unknown-linux-musl.tar.gz ;;
            macOS-ARM64) target=aarch64-apple-darwin.tar.gz ;;
            macOS-X64) target=x86_64-apple-darwin.tar.gz ;;
            Windows-X64) target=x86_64-pc-windows-msvc.zip ;;
            *) echo "no jj for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/jj" && cd "$RUNNER_TEMP/jj"
          curl -fsSL -o "jj-$target" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-$target"
          case "$target" in *.zip) unzip -q "jj-$target" ;; *) tar -xzf "jj-$target" ;; esac
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
      # a short temp dir: jj's operation files have 128-letter names, over Windows' 260-character path limit
      - run: uv run --locked pytest -v --basetemp="${{ runner.temp }}/t"

  # the app's page: Biome (app/ui/biome.json), svelte-check (app/ui/svelte.config.js) and djLint ([tool.djlint] in
  # pyproject.toml)
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx biome ci . && npx svelte-check --threshold warning --fail-on-warnings
        working-directory: app/ui
      - run: uv run --locked --group dev djlint app/ui/index.html --check
