name: app

# A test build of the desktop app (app/), unsigned, for Windows on x64 and ARM. New ledgers in it take kingsmint
# from this commit (KINGSMINT_REV). Runs on a push to a branch app/<name>; the installers are the run's artifacts.
on:
  push:
    branches: ["app/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: sh scripts/fetch-sidecars.sh
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
        working-directory: app/src-tauri
        env:
          KINGSMINT_REV: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: kingsmint-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/nsis/*.exe
