name: release

# Push a tag v<version from pyproject.toml>: tests, then a GitHub release with the Claude app plugin and extension,
# and the Kingsmint app for macOS, signed and notarized, and for Windows (x64, ARM), not signed. Its secrets: APPLE_CERTIFICATE (the Developer ID Application
# .p12, base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: <name> (<team>)"),
# and an App Store Connect API key for the notarization: APPLE_API_ISSUER, APPLE_API_KEY (its ID), APPLE_API_KEY_P8.
# TAURI_SIGNING_PRIVATE_KEY (no password) signs the app's updates; its public key is in app/src-tauri/tauri.conf.json.
# The release's latest.json lists them: the installed apps find it at releases/latest/download/latest.json.
# Without APPLE_CERTIFICATE and APPLE_API_KEY_P8 the Mac app is skipped. The release has kingsmint's wheel too: the
# app's new ledgers install it (app/src-tauri/src/main.rs, make_ledger).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apple: ${{ steps.apple.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run --locked pytest
      - name: Tag matches the version
        run: test "$GITHUB_REF_NAME" = "v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: The plugin installs from this tag
        run: test "$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)" = "$GITHUB_REF_NAME"
      - name: The app has this version
        run: |
          test "v$(jq -r .version app/src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
          test "v$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml)" = "$GITHUB_REF_NAME"
          test "v$(sed -n '/^name = "kingsmint-app"$/{n;s/^version = "\(.*\)"/\1/p;}' app/src-tauri/Cargo.lock)" = "$GITHUB_REF_NAME"
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' src/kingsmint/CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "src/kingsmint/CHANGELOG.md has no section ## ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: uv run --locked python desktop/build.py
      - run: uv build --wheel
      - run: gh release create "$GITHUB_REF_NAME" desktop/dist/kingsmint.plugin desktop/dist/kingsmint.mcpb dist/kingsmint-*-py3-none-any.whl --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # a job's `if` cannot read secrets: the macos job reads this output
      - id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo "apple=${APPLE_CERTIFICATE:+${APPLE_API_KEY_P8:+yes}}" >> "$GITHUB_OUTPUT"

  # a universal app, for Apple silicon and Intel Macs; Tauri takes the sidecars of both targets for their builds, and
  # the two joined (lipo) for the bundle
  macos:
    needs: release
    if: needs.release.outputs.apple == 'yes'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: uv and jj for both Mac targets, and joined
        run: |
          sh app/scripts/fetch-sidecars.sh aarch64-apple-darwin
          sh app/scripts/fetch-sidecars.sh x86_64-apple-darwin
          cd app/src-tauri/binaries
          for b in uv jj; do
            lipo -create -output "$b-universal-apple-darwin" "$b-aarch64-apple-darwin" "$b-x86_64-apple-darwin"
            "./$b-universal-apple-darwin" --version
          done
      - name: Build, sign and notarize
        working-directory: app/src-tauri
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8" npx --yes @tauri-apps/cli@2.12.6 build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
          # Tauri notarizes the app, not the dmg around it: Gatekeeper rejects an unnotarized dmg once downloaded
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          # the update beside the dmg, so the artifact has no folders
          cp target/universal-apple-darwin/release/bundle/macos/Kingsmint.app.tar.gz* "$(dirname "$dmg")"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
          if-no-files-found: error

  # NSIS installers, not signed: Windows SmartScreen warns before the first start. New ledgers take the release's wheel.
  windows:
    needs: release
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: sh scripts/fetch-sidecars.sh
      - run: npx --yes @tauri-apps/cli@2.12.6 build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/nsis/*.exe*
          if-no-files-found: error

  # the only job after the tests that may write to the release; the builds, one with the signing secrets, cannot.
  # It uploads what was built: without the Apple secrets, the macos job is skipped and the release has no dmg
  upload:
    needs: [macos, windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # latest.json for the updater: each platform's update and its signature. The universal Mac app serves both Macs;
      # a platform not built is left out, and its apps find no update
      - name: latest.json
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          entry() { if [ -f "$2" ]; then jq -n --arg k "$1" --arg u "$url/$2" --arg s "$(cat "$2.sig")" '{($k): {url: $u, signature: $s}}'; fi; }
          { entry darwin-aarch64 Kingsmint.app.tar.gz
            entry darwin-x86_64 Kingsmint.app.tar.gz
            entry windows-x86_64 Kingsmint_*_x64-setup.exe
            entry windows-aarch64 Kingsmint_*_arm64-setup.exe
          } | jq -s --arg v "${GITHUB_REF_NAME#v}" '{version: $v, pub_date: (now | todate), platforms: add}' > latest.json
          cat latest.json
      - run: gh release upload "$GITHUB_REF_NAME" $(ls *.dmg *.exe *.app.tar.gz *.sig latest.json 2>/dev/null) --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
