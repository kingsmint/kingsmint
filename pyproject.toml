[project]
name = "kingsmint"
version = "0.2.4"
description = "Personal and one-person-company accounting with Beancount, Fava, and Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.2",
    "beanquery",
    "fava>=1.30",
    "pypdfium2>=4.30",
    "tree-sitter-language-pack>=1.25.0",
]

[project.scripts]
kingsmint = "kingsmint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kingsmint/skills"  # `kingsmint skills` copies them into a ledger, from the version the ledger runs

[dependency-groups]
dev = [
    "djlint>=1.54.0",
    "dulwich>=1.2.20",
    "pytest",
]

# the app's HTML page (app/ui/index.html)
[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 120
preserve_blank_lines = true
